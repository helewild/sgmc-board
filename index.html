<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Seventh Gear MC</title>
  <style>
    :root{
      --bg:#0b0b0b;
      --panel:#111;
      --panel2:#0f0f0f;
      --text:#e8e8e8;
      --muted:#9aa0a6;
      --gold:#d8b35a;
      --red:#ff5c5c;
      --border:#232323;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    header{
      padding:22px 26px 10px 26px;
      font-weight:800;
      letter-spacing:.5px;
      color:var(--gold);
      font-size:22px;
    }
    .wrap{
      padding:0 22px 26px 22px;
    }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:18px;
    }
    .card{
      background:linear-gradient(180deg,var(--panel),var(--panel2));
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      min-height:170px;
    }
    .card h2{
      margin:0;
      padding:16px 16px 10px 16px;
      font-size:14px;
      font-weight:800;
      color:var(--text);
    }
    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }
    thead th{
      text-align:left;
      padding:10px 16px;
      color:var(--muted);
      font-weight:700;
      border-top:1px solid var(--border);
      border-bottom:1px solid var(--border);
    }
    tbody td{
      padding:10px 16px;
      border-bottom:1px solid rgba(35,35,35,.7);
      color:var(--text);
    }
    .gold{ color:var(--gold); font-weight:800; }
    .muted{ color:var(--muted); }
    .errorRow{
      color:var(--red);
      font-weight:700;
    }
    .footerErr{
      margin-top:10px;
      padding:10px 6px 0 6px;
      color:var(--red);
      font-weight:800;
      font-size:14px;
    }
    .footerErr span{
      font-weight:500;
      color:var(--muted);
      margin-left:6px;
    }
    @media (max-width: 1100px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <header>THE SEVENTH GEAR MC</header>

  <div class="wrap">
    <div class="grid">
      <section class="card">
        <h2>Patch Tracking</h2>
        <table>
          <thead>
            <tr>
              <th class="gold">Role</th>
              <th class="gold">Name</th>
              <th class="muted">Region</th>
            </tr>
          </thead>
          <tbody id="patchTbody">
            <tr><td class="errorRow" colspan="3">Loading</td></tr>
          </tbody>
        </table>
      </section>

      <section class="card">
        <h2>Loyalty Leaderboard</h2>
        <table>
          <thead>
            <tr>
              <th class="gold">Points</th>
              <th class="gold">Name</th>
              <th class="muted">Role</th>
            </tr>
          </thead>
          <tbody id="lbTbody">
            <tr><td class="errorRow" colspan="3">Loading</td></tr>
          </tbody>
        </table>
      </section>

      <section class="card">
        <h2>Ride Outs</h2>
        <table>
          <thead>
            <tr>
              <th class="gold">Date</th>
              <th class="gold">Title</th>
              <th class="muted">Location</th>
              <th class="muted">Notes</th>
            </tr>
          </thead>
          <tbody id="rideTbody">
            <tr><td class="errorRow" colspan="4">Loading</td></tr>
          </tbody>
        </table>
      </section>
    </div>

    <div id="apiErr" class="footerErr" style="display:none;">
      API error <span id="apiErrMsg"></span>
    </div>
  </div>

  <script>
    // Set these two
    const API_URL = "https://script.google.com/macros/s/AKfycbzBVmCshhIrFYyOwpAW3tHyM_T1ROZWuYkyorEkHAo4cXfJcaw0ui3ITQnkzLkqXVE3Ww/exec";
    const TOKEN_VALUE = "Apples123";

    function esc(s){
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }

    function showApiError(msg){
      const box = document.getElementById("apiErr");
      const m = document.getElementById("apiErrMsg");
      m.textContent = msg || "Unknown error";
      box.style.display = "block";
    }

    function clearApiError(){
      document.getElementById("apiErr").style.display = "none";
      document.getElementById("apiErrMsg").textContent = "";
    }

    // JSONP loader with timeout and hard failure reporting
    function jsonp(url, params, timeoutMs){
      return new Promise((resolve, reject) => {
        const cbName = "cb_" + Math.random().toString(36).slice(2);
        const qs = new URLSearchParams(params || {});
        qs.set("callback", cbName);

        const script = document.createElement("script");
        let done = false;

        const timer = setTimeout(() => {
          if (done) return;
          done = true;
          cleanup();
          reject(new Error("JSONP timeout"));
        }, timeoutMs || 12000);

        function cleanup(){
          clearTimeout(timer);
          try { delete window[cbName]; } catch(e) { window[cbName] = undefined; }
          if (script && script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = (data) => {
          if (done) return;
          done = true;
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          if (done) return;
          done = true;
          cleanup();
          reject(new Error("JSONP load failed"));
        };

        script.src = url + (url.includes("?") ? "&" : "?") + qs.toString();
        document.head.appendChild(script);
      });
    }

    async function loadPanel(action){
      const baseParams = { token: TOKEN_VALUE, action: action };
      return await jsonp(API_URL, baseParams, 12000);
    }

    function setErrorRow(tbodyId, colspan, text){
      const tb = document.getElementById(tbodyId);
      tb.innerHTML = `<tr><td class="errorRow" colspan="${colspan}">${esc(text)}</td></tr>`;
    }

    function renderPatches(data){
      const tb = document.getElementById("patchTbody");
      if (!data || !data.ok){
        setErrorRow("patchTbody", 3, (data && data.error) ? data.error : "Error loading");
        return;
      }
      if (!data.items || !data.items.length){
        setErrorRow("patchTbody", 3, "No records");
        return;
      }
      tb.innerHTML = data.items.map(it => `
        <tr>
          <td class="gold">${esc(it.role)}</td>
          <td>${esc(it.name)}</td>
          <td class="muted">${esc(it.region)}</td>
        </tr>
      `).join("");
    }

    function renderLeaderboard(data){
      const tb = document.getElementById("lbTbody");
      if (!data || !data.ok){
        setErrorRow("lbTbody", 3, (data && data.error) ? data.error : "Error loading");
        return;
      }
      if (!data.items || !data.items.length){
        setErrorRow("lbTbody", 3, "No records");
        return;
      }
      tb.innerHTML = data.items.map(it => `
        <tr>
          <td class="gold">${esc(it.points)}</td>
          <td>${esc(it.name)}</td>
          <td class="muted">${esc(it.role)}</td>
        </tr>
      `).join("");
    }

    function renderRides(data){
      const tb = document.getElementById("rideTbody");
      if (!data || !data.ok){
        setErrorRow("rideTbody", 4, (data && data.error) ? data.error : "Error loading");
        return;
      }
      if (!data.items || !data.items.length){
        setErrorRow("rideTbody", 4, "No records");
        return;
      }
      tb.innerHTML = data.items.map(it => `
        <tr>
          <td class="gold">${esc(it.date)}</td>
          <td>${esc(it.title)}</td>
          <td class="muted">${esc(it.location)}</td>
          <td class="muted">${esc(it.notes)}</td>
        </tr>
      `).join("");
    }

    async function boot(){
      clearApiError();

      // Default loading rows
      setErrorRow("patchTbody", 3, "Loading");
      setErrorRow("lbTbody", 3, "Loading");
      setErrorRow("rideTbody", 4, "Loading");

      try{
        const [patches, leaderboard, rides] = await Promise.all([
          loadPanel("patches"),
          loadPanel("leaderboard"),
          loadPanel("rides")
        ]);

        renderPatches(patches);
        renderLeaderboard(leaderboard);
        renderRides(rides);

        // If any panel failed, show the footer api error too
        const err = (!patches.ok && patches.error) ? patches.error
                  : (!leaderboard.ok && leaderboard.error) ? leaderboard.error
                  : (!rides.ok && rides.error) ? rides.error
                  : "";

        if (err) showApiError(err);

      } catch(e){
        // This is the exact case you are seeing
        showApiError(e.message || "JSONP load failed");
        setErrorRow("patchTbody", 3, "Error loading");
        setErrorRow("lbTbody", 3, "Error loading");
        setErrorRow("rideTbody", 4, "Error loading");
      }
    }

    boot();
  </script>
</body>
</html>
