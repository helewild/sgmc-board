<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="60">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>THE SEVENTH GEAR MC</title>
  <style>
    body{margin:0;background:#0b0b0b;color:#e7d6b0;font-family:Arial}
    .wrap{padding:16px}
    h1{font-size:20px;margin:0 0 10px 0;letter-spacing:1px}
    .row{display:flex;gap:16px;flex-wrap:wrap}
    .card{background:#121212;border:1px solid #2a2a2a;border-radius:12px;padding:12px;min-width:320px;flex:1}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px 6px;border-bottom:1px solid #2a2a2a;font-size:13px;vertical-align:top}
    th{color:#f0c86a;text-align:left}
    .muted{color:#9a9a9a}
    .err{color:#ffb3b3}
  </style>
</head>
<body>
<div class="wrap">
  <h1>THE SEVENTH GEAR MC</h1>

  <div class="row">
    <div class="card">
      <div style="font-size:15px;margin-bottom:8px">Patch Tracking</div>
      <table id="rosterTbl">
        <tr><th>Role</th><th>Name</th><th class="muted">Region</th></tr>
        <tr><td colspan="3" class="muted">Loading…</td></tr>
      </table>
    </div>

    <div class="card">
      <div style="font-size:15px;margin-bottom:8px">Loyalty Leaderboard</div>
      <table id="leadTbl">
        <tr><th>Points</th><th>Name</th><th class="muted">Role</th></tr>
        <tr><td colspan="3" class="muted">Loading…</td></tr>
      </table>
    </div>

    <div class="card">
      <div style="font-size:15px;margin-bottom:8px">Ride Outs</div>
      <table id="ridesTbl">
        <tr>
          <th>Date</th>
          <th>Title</th>
          <th class="muted">Location</th>
          <th class="muted">Notes</th>
        </tr>
        <tr><td colspan="4" class="muted">Loading…</td></tr>
      </table>
    </div>
  </div>

  <div id="status" class="muted" style="margin-top:10px">Loading…</div>
</div>

<script>
  var API_EXEC = "https://script.google.com/macros/s/PASTE_YOUR_EXEC_ID_HERE/exec";

  function esc(s){
    s = String(s==null?"":s);
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function render(data){
    var rosterTbl = document.getElementById("rosterTbl");
    var leadTbl = document.getElementById("leadTbl");
    var ridesTbl = document.getElementById("ridesTbl");
    var status = document.getElementById("status");

    if(!data || !data.ok){
      rosterTbl.innerHTML = '<tr><th>Role</th><th>Name</th><th class="muted">Region</th></tr><tr><td colspan="3" class="err">Error loading</td></tr>';
      leadTbl.innerHTML = '<tr><th>Points</th><th>Name</th><th class="muted">Role</th></tr><tr><td colspan="3" class="err">Error loading</td></tr>';
      ridesTbl.innerHTML = '<tr><th>Date</th><th>Title</th><th class="muted">Location</th><th class="muted">Notes</th></tr><tr><td colspan="4" class="err">Error loading</td></tr>';
      status.innerHTML = '<span class="err">API error:</span> ' + esc(data && data.error ? data.error : "Unknown");
      return;
    }

    var rr = data.roster || [];
    var ll = data.leaderboard || [];
    var rides = data.rides || [];

    var rHtml = '<tr><th>Role</th><th>Name</th><th class="muted">Region</th></tr>';
    if(rr.length === 0){
      rHtml += '<tr><td colspan="3" class="muted">No members yet</td></tr>';
    } else {
      for(var i=0;i<rr.length;i++){
        var x = rr[i];
        rHtml += '<tr><td>'+esc(x.role)+'</td><td>'+esc(x.name||x.uuid)+'</td><td class="muted">'+esc(x.region||"")+'</td></tr>';
      }
    }
    rosterTbl.innerHTML = rHtml;

    var lHtml = '<tr><th>Points</th><th>Name</th><th class="muted">Role</th></tr>';
    if(ll.length === 0){
      lHtml += '<tr><td colspan="3" class="muted">No points yet</td></tr>';
    } else {
      for(var j=0;j<ll.length;j++){
        var y = ll[j];
        lHtml += '<tr><td>'+Number(y.points||0)+'</td><td>'+esc(y.name||y.uuid)+'</td><td class="muted">'+esc(y.role||"")+'</td></tr>';
      }
    }
    leadTbl.innerHTML = lHtml;

    var rideHtml = '<tr><th>Date</th><th>Title</th><th class="muted">Location</th><th class="muted">Notes</th></tr>';
    if(rides.length === 0){
      rideHtml += '<tr><td colspan="4" class="muted">No rides scheduled</td></tr>';
    } else {
      for(var k=0;k<rides.length;k++){
        var r = rides[k];
        rideHtml += '<tr>' +
          '<td>'+esc(r.pretty_date || r.date || "")+'</td>' +
          '<td>'+esc(r.title || "")+'</td>' +
          '<td class="muted">'+esc(r.location || "")+'</td>' +
          '<td class="muted">'+esc(r.notes || "")+'</td>' +
        '</tr>';
      }
    }
    ridesTbl.innerHTML = rideHtml;

    status.textContent = "Updated " + (data.now || "");
  }

  window.SGMC_CB = function(payload){ render(payload); };

  (function(){
    var s = document.createElement("script");
    s.src = API_EXEC + "?mode=board_jsonp&cb=SGMC_CB&_=" + Date.now();
    s.onerror = function(){
      render({ok:false,error:"JSONP load failed"});
    };
    document.head.appendChild(s);
  })();
</script>

</body>
</html>
